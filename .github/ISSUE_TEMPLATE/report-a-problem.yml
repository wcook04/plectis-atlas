name: Suggest a change or ask a precise question
description: One source-linked correction, question, example or suggestion for the next reader.
title: "Note: "
labels: ["problem"]
body:
  - type: markdown
    attributes:
      value: |
        Pick one passage. Give its location, your note, and what supports it. A precise question is welcome; you do not need a verdict on the whole result. If the note is incorporated, its credit links back here.
  - type: input
    id: page
    attributes:
      label: Where
      description: The atlas page or source link, with the statement label or passage and source commit where relevant.
    validations:
      required: true
  - type: textarea
    id: note
    attributes:
      label: Your note
      description: One correction, question, example or suggested explanation. Say what remains uncertain.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: What you checked
      description: The exact source passage or small calculation. For a question, say which sources you read and which step you cannot follow.
    validations:
      required: true
  - type: input
    id: ai_assistance
    attributes:
      label: AI assistance
      description: Write none, or state which tools helped and how.
    validations:
      required: true
  - type: input
    id: name
    attributes:
      label: Public name for credit (optional)
      description: Leave empty to use your GitHub handle.
  - type: checkboxes
    id: agreement
    attributes:
      label: Before submitting
      options:
        - label: I understand the note and have made its uncertainty clear. I agree to the repository's contribution terms in CONTRIBUTING.md and NOTICE.
          required: true
