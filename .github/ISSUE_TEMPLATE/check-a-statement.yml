name: Check a statement
description: Say whether one Lean statement says what the paper's theorem says, without using git.
title: "Check: "
labels: ["statement-check"]
body:
  - type: markdown
    attributes:
      value: |
        A statement check compares one Comparator challenge and all its configured theorems with the located paper statements and gives one of five verdicts. The procedure, the checklist and a worked example are in [skills/check-a-statement/SKILL.md](https://github.com/wcook04/plectis-atlas/blob/main/skills/check-a-statement/SKILL.md).

        For a smaller observation, use the note form. A full verdict concerns correspondence with the specified paper statements; it does not claim that Comparator has been replayed.

        A maintainer turns this form into `contributions/checks/<statement>/<your-github-handle>.md`, credited to you. If you use git, a pull request with that file is quicker.
  - type: input
    id: statement
    attributes:
      label: Statement id
      description: The name of the Lean challenge file, for example ErdosReciprocal.
    validations:
      required: true
  - type: input
    id: target
    attributes:
      label: Exact version
      description: Filled in by the link you followed. It names the family or statement and a fingerprint of its current text, so your contribution stays tied to what you read. Leave it as it is.
  - type: input
    id: upstream_commit
    attributes:
      label: Source commit
      description: The full 40-character openai/math commit you read, from upstream.json.
    validations:
      required: true
  - type: input
    id: paper_statement
    attributes:
      label: Where the paper states it
      description: The manuscript, then the number, title if any, label and section of the result.
      placeholder: Manuscript folder, label, source file and section; add a theorem number only after checking it
    validations:
      required: true
  - type: dropdown
    id: verdict
    attributes:
      label: Verdict
      description: matches, stronger-than-paper, weaker-than-paper, different or cannot-tell. The skill defines each one.
      options:
        - cannot-tell
        - matches
        - stronger-than-paper
        - weaker-than-paper
        - different
    validations:
      required: true
  - type: textarea
    id: paper
    attributes:
      label: What the paper says
      description: Quote the statement exactly, then say what every symbol ranges over.
    validations:
      required: true
  - type: textarea
    id: lean
    attributes:
      label: What the Lean statement says
      description: Every definition in the file in words, then the theorem as one plain sentence with its quantifiers in order.
    validations:
      required: true
  - type: textarea
    id: differences
    attributes:
      label: Differences
      description: Every difference you found and whether it matters, and the checks that found no difference.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why this verdict
      description: For matches, show that each statement implies the other. Otherwise justify the comparison at its stated scope, or say what stopped you. An unproved converse is not automatically false.
    validations:
      required: true
  - type: input
    id: name
    attributes:
      label: Your name, as it should appear on the atlas
    validations:
      required: true
  - type: input
    id: background
    attributes:
      label: Your background, in one line
      placeholder: PhD student in additive combinatorics; first time reading Lean
    validations:
      required: true
  - type: textarea
    id: ai_assistance
    attributes:
      label: AI assistance
      description: Write none, or say which tool did what.
    validations:
      required: true
  - type: checkboxes
    id: agreement
    attributes:
      label: Signature
      options:
        - label: I read the whole challenge file and the paper statement myself, and I sign this verdict.
          required: true
        - label: I agree that this check is published on the atlas under the licence of the repository (see NOTICE), credited to me by name.
          required: true
