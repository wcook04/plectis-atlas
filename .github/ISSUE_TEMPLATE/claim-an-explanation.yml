name: Announce an explanation you are working on
description: Optionally coordinate work on one passage, lemma or argument, for a named reader.
title: "Working on: explanation in family "
labels: ["claim", "explanation"]
body:
  - type: markdown
    attributes:
      value: |
        This announcement is optional and reserves nothing. Name the passage and reader you have in mind. Other explanations are welcome, including for the same reader.

        Link a draft when you have one. After a week without a progress link, maintainers may mark the announcement inactive. Returning to it is welcome. An announcement does not count as an accepted explanation.
  - type: input
    id: family
    attributes:
      label: Family id
      description: The three digits shown on the atlas, for example 159.
      placeholder: "159"
    validations:
      required: true
  - type: input
    id: name
    attributes:
      label: Your name, as it should appear on the atlas
    validations:
      required: true
  - type: textarea
    id: reader
    attributes:
      label: The passage and reader you are writing for
      description: Give the definition, example, lemma or argument you plan to explain, its source version, and the background you expect from a reader.
    validations:
      required: true
  - type: textarea
    id: background
    attributes:
      label: Your background with this mathematics
      description: One or two lines. It helps reviewers.
  - type: textarea
    id: ai_assistance
    attributes:
      label: How you plan to use AI tools, if at all
      placeholder: none
  - type: checkboxes
    id: agreement
    attributes:
      label: Before you announce
      options:
        - label: I will understand and stand behind every sentence I submit, and I will say in the file how I used AI tools.
          required: true
        - label: This announcement may be public. I will agree publication terms when I submit the actual explanation.
          required: true
