name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    # Pinned: Playwright 1.52 has no Chromium build for ubuntu-latest's 26.04 image,
    # so the share cards below need a release it supports.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      # Every vendored Statement Map packet against its manifest, release, pin and generation,
      # before any page is built from them.
      - name: Check the backend's vendored packets
        run: python3 scripts/reader.py
      - run: python3 scripts/build_site.py
      # The papers' reading pages: the pinned release's TeX, with every formula checked by
      # the KaTeX version the site loads (site/config.json). They are written after the
      # site build, which clears site/_build.
      - name: Fetch the pinned release's TeX sources
        run: sh scripts/fetch_upstream.sh
      - name: Build the papers' reading pages (formulas checked with the site's own KaTeX)
        run: python3 scripts/build_papers.py
      - name: The front door, the release universe (index.html), drawn from the built site's data
        run: python3 scripts/build_universe.py
      - name: Statement pages and reading pages link each other both ways
        run: python3 scripts/check_paper_links.py site/_build
      - name: Agent routes and all map relationships resolve within the published site
        run: python3 scripts/tests/test_agent_navigation.py --built site/_build
      # Share cards: the picture a family's link shows when someone posts it, in words and
      # typeset mathematics. A card that overflows or whose formulas fail is not rendered, and
      # that family keeps the generic picture; if the headless browser cannot be installed,
      # every family keeps it and the deploy goes on.
      - name: Install a headless browser for the share cards
        continue-on-error: true
        run: |
          python3 -m pip install --quiet playwright==1.52.0
          python3 -m playwright install --with-deps chromium
      - name: Render each family's share card
        continue-on-error: true
        run: python3 scripts/cards.py
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site/_build
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
