name: check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      # A pull request may change the checker itself, so its contribution files are also checked by
      # the base branch's checker and data, which the pull request cannot edit.
      - name: Fetch the base branch's checker
        if: github.event_name == 'pull_request'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .trusted
          persist-credentials: false
      - name: Changed contributions pass the base branch's strict checker
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git diff -z --name-only --diff-filter=AM "$BASE_SHA" HEAD -- contributions/ \
            | { grep -z -v -e '^contributions/_templates/' -e '/README.md$' || true; } > "$RUNNER_TEMP/changed"
          while IFS= read -r -d '' f; do
            mkdir -p ".trusted/$(dirname "$f")" && cp -- "$f" ".trusted/$f"
          done < "$RUNNER_TEMP/changed"
          cd .trusted && xargs -0 -r python3 scripts/check_contributions.py --strict < "$RUNNER_TEMP/changed"
      - name: Repository roles and placement regressions
        run: |
          python3 scripts/check_repository_structure.py
          python3 scripts/tests/test_repository_structure.py
      - name: Statement Map's vendored packets pass the reader's checks
        run: python3 scripts/tests/test_reader.py
      - name: The site search normalises queries exactly as Statement Map indexed them
        run: python3 scripts/tests/test_search.py
      - name: Map labels and navigation handle dense views and loading failures
        run: |
          node scripts/tests/test_universe_labels.js
          node scripts/tests/test_universe_interactions.js
          node scripts/tests/test_universe_performance.js
      - name: The data parsers read their fixtures correctly
        run: python3 scripts/tests/test_build_data.py
      - name: The paper reader converts its fixtures correctly
        run: |
          python3 scripts/tests/test_build_papers.py
          python3 scripts/tests/test_check_paper_links.py
      - name: Previous and next links follow each parent page's order
        run: python3 scripts/tests/test_sibling_nav.py
      - name: The contribution checker rejects what it should
        run: python3 scripts/check_contributions.py --self-test
      - name: Contributions are well formed
        run: python3 scripts/check_contributions.py
      - name: Community records are well formed
        run: |
          python3 curated/check_community.py --self-test
          python3 curated/check_community.py
      - name: Agent skill mirrors are in sync
        run: python3 scripts/sync_skills.py --check
      - name: README numbers match the data
        run: python3 scripts/sync_readme.py --check
      - name: Attribution inventory and notice regressions
        run: python3 scripts/tests/test_attribution.py
      - name: Site builds with licence notices
        run: |
          python3 scripts/build_site.py
          python3 scripts/attribution.py --built site/_build
      - name: Paper links pass the same integration check as the website release
        run: |
          sh scripts/fetch_upstream.sh
          python3 scripts/build_papers.py --jobs 2
          python3 scripts/build_universe.py
          python3 scripts/check_paper_links.py site/_build
          python3 scripts/tests/test_agent_navigation.py --built site/_build
